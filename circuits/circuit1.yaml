        {command: "MK", segment: -10, img: "flecha.1", x: -0.9, z: 0.0, w: 0.5, h: 1.0},
        {command: "MK", segment: -11, img: "flecha.2", x: -0.9, z: 0.0, w: 0.5, h: 1.0},
        {command: "MK", segment: -10, img: "flecha.1", x: -0.25, z: 0.0, w: 0.5, h: 1.0},
        {command: "MK", segment: -11, img: "flecha.2", x: -0.25, z: 0.0, w: 0.5, h: 1.0},
        {command: "MK", segment: -10, img: "flecha.1", x: 0.4, z: 0.0, w: 0.5, h: 1.0},
        {command: "MK", segment: -11, img: "flecha.2", x: 0.4, z: 0.0, w: 0.5, h: 1.0},
      ]
    - name: "primera_seccion_enlazadas"
      data: [
        # --- Primera izquierda ---
        {command: "R", segments: 45, curve: "CL"},
        {command: "O", img: "arbol", step: 4.5, offset: 0.0, x: -1.45, random_x: -0.25, random_step: 1.0},
        {command: "O", img: "arbol.2", step: 5.5, offset: 2.0, x: 1.45, random_x: 0.25, random_step: 1.0},
        {command: "O", img: "arbol.3", step: 6.5, offset: 1.0, x: -1.75, random_x: -0.30, random_step: 1.3},
        {command: "O", img: "arbol.4", step: 7.0, offset: 3.0, x: 1.75, random_x: 0.30, random_step: 1.3},
        {command: "O", img: "arbol.2", step: 9.0, offset: 3.0, x: -2.1, random_x: -0.35, random_step: 1.8},
        {command: "O", img: "arbol", step: 10.0, offset: 5.0, x: 2.1, random_x: 0.35, random_step: 1.8},
        {command: "O", img: "arbusto", step: 3.5, offset: 0.0, x: -1.4, random_x: -0.20, random_step: 0.8, collidable: false},
        {command: "O", img: "arbusto", step: 4.0, offset: 2.0, x: 1.4, random_x: 0.20, random_step: 0.8, collidable: false},
        {command: "V", img: "vegetacion.3", x: 2.3, step_x: 1.0, step_z: 6.0, offset: 1.0, number: 1},
        {command: "V", img: "vegetacion.3", x: 4.0, step_x: 1.3, step_z: 8.0, offset: 0.5, number: 1},
        {command: "F", img: "arbol.2", x: 5.0, step_x: 1.2, step_z: 9.0, offset: 1.5, number: 1, random_x: 0.60, random_step: 3.0},
        {command: "F", img: "arbol.3", x: 10.0, step_x: 1.0, step_z: 2.5, offset: 0.0, number: 1, random_x: 0.75, random_step: 1.5},
        {command: "F", img: "arbol.4", x: 15.0, step_x: 2.0, step_z: 7.0, offset: 1.0, number: 1, random_x: 1.50, random_step: 4.0},

        # --- Derecha: seguimos en el bosque pero cambiamos especies ---
        {command: "R", segments: 45, curve: "CR"},
        {command: "O", img: "arbol.2", step: 5.0, offset: 0.0, x: -1.5, random_x: -0.25, random_step: 1.0},
        {command: "O", img: "arbol", step: 4.5, offset: 2.0, x: 1.5, random_x: 0.25, random_step: 1.0},
        {command: "O", img: "arbol.4", step: 7.0, offset: 1.0, x: -1.8, random_x: -0.30, random_step: 1.3},
        {command: "O", img: "arbol.3", step: 6.5, offset: 3.0, x: 1.8, random_x: 0.30, random_step: 1.3},
        {command: "O", img: "piedra", step: 14.0, offset: 4.0, x: 1.45, random_x: 0.25, random_step: 2.5, profile: "piedra"},
        {command: "V", img: "vegetacion.3", x: 2.2, step_x: 1.0, step_z: 6.0, offset: 0.5, number: 1},
        {command: "V", img: "vegetacion.3", x: 4.0, step_x: 1.3, step_z: 8.0, offset: 1.0, number: 1},
        {command: "F", img: "arbol.4", x: 5.0, step_x: 1.2, step_z: 9.0, offset: 1.0, number: 1, random_x: 0.60, random_step: 3.0},
        {command: "F", img: "arbol", x: 10.0, step_x: 1.0, step_z: 2.5, offset: 0.0, number: 1, random_x: 0.75, random_step: 1.5},
        {command: "F", img: "arbol.2", x: 15.0, step_x: 2.0, step_z: 7.0, offset: 1.0, number: 1, random_x: 1.50, random_step: 4.0},

        {command: "E", segment: 20, x_rel: -0.2, speed: 9.0, img: "enemigo.1"},

        # --- Segunda derecha, corta: pequeño claro lateral ---
        {command: "R", segments: 35, curve: "CR"},
        {command: "O", img: "arbol", step: 4.5, offset: 0.0, x: -1.45, random_x: -0.25, random_step: 1.0},
        {command: "O", img: "arbol.3", step: 6.5, offset: 2.0, x: -1.8, random_x: -0.30, random_step: 1.3},
        {command: "O", img: "arbol.4", step: 9.0, offset: 4.0, x: -2.1, random_x: -0.35, random_step: 1.8},
